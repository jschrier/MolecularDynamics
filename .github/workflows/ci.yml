name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Emscripten SDK 3.1.64
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64
      - run: npm ci
      - run: npm test
      - run: npx tsc -b --pretty false
      - name: Build production site
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run build
